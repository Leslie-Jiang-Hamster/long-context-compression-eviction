benchmark: longbench
subset:
  - multi_document_qa
model:
  name: "to_be_filled"
  max_context: 32768
methods:
  - full_kv
  - h2o
  - streamingllm
  - compllm_style
  - ours_hybrid
metrics:
  semantic:
    - faithfulness
    - answer_relevancy
    - context_precision
  string:
    - f1
    - rouge_l
    - accuracy
  resource:
    - kv_mem_reduction
    - peak_vram
    - throughput
judge:
  model: "to_be_filled"
  temperature: 0
  repeats: 3
  human_audit_ratio: 0.1
